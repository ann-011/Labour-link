<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labour Link</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        body {
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
            background-color: #e6ffe6;
            background: url('—Pngtree—spring recruitment cartoon banner_994788.jpg'); /* Add your image URL here */
            background-size: cover; /* This will ensure the image covers the entire background */
            background-position: center; /* Center the background image */
            background-repeat: no-repeat; /* Prevent the image from repeating */
            color: #fff;
        }
        h1 {
            color: #333; /* Adjusted text color for better contrast */
            margin-bottom: 30px;
        }
        p {
            font-size: 18px;
            color: #666; /* Adjusted text color for better contrast */
            margin-bottom: 30px;
        }
        .button {
            background-color: #ff6f61;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 25px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .button:hover {
            background-color: #ff4d4d;
            transform: translateY(-5px);
        }
        .login-link {
            color: #ff6f61;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link:hover {
            color: #ff4d4d;
        }
        .image-container {
            margin-bottom: 30px;
        }
        .image-container img {
            width: 200px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Labour Link</h1>
        <p>Connecting workers to opportunities</p>
        <div class="image-container">
            <!-- Add an image here if needed -->
        </div>
        <div>
            <button class="button" onclick="window.location.href='register.html';">Job Seeker</button>
            <button class="button" onclick="window.location.href='recreg.html';">Recruiter</button>
        </div>
        <p>Already have an account? <a class="login-link" href="login.html">Login</a></p>
        <div>
            <button class="button" onclick="window.location.href='1stpage.html';">Go Back</button> <!-- Updated Back Button -->
        </div>
    </div>
</body>
</html>
