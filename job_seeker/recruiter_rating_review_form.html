<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Rating and Review</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form action="submit_recruiter_review.php" method="post">
        <h2>Rate and Review Recruiter</h2>

        <label for="recruiter">Select Recruiter:</label>
        <select name="r_id" id="recruiter">
            <!-- Dynamically populate this with recruiters from your database -->
            <option value="1">Recruiter 1</option>
            <option value="2">Recruiter 2</option>
        </select>

        <label for="rating">Overall Rating (1-5):</label>
        <input type="number" id="rating" name="rating" min="1" max="5" required>

        <label for="job_performance_rating">Job Performance Rating (1-5):</label>
        <input type="number" id="job_performance_rating" name="job_performance_rating" min="1" max="5" required>

        <label for="salary_rating">Salary Rating (1-5):</label>
        <input type="number" id="salary_rating" name="salary_rating" min="1" max="5" required>

        <label for="review_text">Review:</label>
        <textarea id="review_text" name="review_text" rows="4" cols="50"></textarea>

        <button type="submit">Submit Review</button>
    </form>

</body>
</html>
