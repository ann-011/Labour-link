<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabourLink - Seeker Home</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            transition: background-color 0.5s;
        }

        /* Header Styles */
        .header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Sidebar Styles */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.7);
            padding-top: 20px;
            transition: 0.5s;
            overflow-x: hidden;
            z-index: 999;
        }

        .sidebar a {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 16px;
            color: white;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        .openbtn {
            font-size: 20px;
            cursor: pointer;
            background-color: transparent;
            color: #333;
            padding: 10px 15px;
            border: none;
            transition: all 0.3s ease;
            position: fixed;
            top: 20px;
            left: 20px;
        }

        .openbtn:hover {
            background-color: rgba(0, 0, 0, 0.3);
        }

        .content {
            padding: 20px;
            margin-left: 60px;
            transition: all 0.5s ease;
        }

        /* Search Bar Styles */
        .search-bar {
            padding: 20px;
            text-align: center;
            background-color: #007bff;
        }

        .search-bar input[type="text"] {
            width: 250px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-right: 10px;
        }

        .search-bar button {
            padding: 10px;
            background-color: #0069d9;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .search-bar button:hover {
            background-color: #0056b3;
        }

        /* Job Cards */
        .job-list {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .job-card {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ddd;
            text-align: center;
            transition: background-color 0.3s;
        }

        .job-card:hover {
            background-color: #f1f1f1;
        }

        .job-card h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #007bff;
        }

        .job-card p {
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="mySidebar">
        <a href="javascript:void(0)" onclick="closeNav()">Close ×</a>
        <a href="home.html">Home</a>
        <a href="view_profile.php">View/Edit Profile</a>
        <a href="apply.html">Apply For New Job</a>
        <a href="applied.php">Applied Jobs</a>
        <a href="complaint.html">Complaint Registration</a>
        
        <a href="logout.php">Log Out</a>
    </div>

    <!-- Main Content -->
    <div class="content" id="main">
        <span class="hello-seeker" id="helloUser">Hello Seeker!</span>
        <button class="openbtn" onclick="openNav()">☰</button>

        <!-- Header -->
        <div class="header">
            <h1>LabourLink - Find Jobs for Skilled Workers</h1>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Enter Job Title">
            <button onclick="searchJobs()">Search</button>
        </div>

        <!-- Job List Section -->
        <div class="job-list" id="jobList">
            <!-- Manually added Job Cards -->
            <div class="card" onclick="goToPage('company-employee.php')">
                <h3 style="color: blue;">Company Employee</h3>
                <p>Location: Vetickal</p>
            </div>

            <div class="card" onclick="goToPage('painter.php')">
                <h3 style="color: blue;">Painter</h3>
                <p>Location: Kochi</p>
            </div>

            <div class="card" onclick="goToPage('teacher.php')">
                <h3 style="color: blue;">Teacher</h3>
                <p>Location: Adimali</p>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        function getUserData() {
            fetch('fetch_user_data.php')
                .then(response => response.json())
                .then(data => {
                    document.getElementById("helloUser").textContent = `Hello ${data.name}!`;
                })
                .catch(error => console.error('Error fetching user data:', error));
        }

        function goToPage(pageUrl) {
            window.location.href = pageUrl; // Redirect to the specified page
        }

        function searchJobs() {
            var searchInput = document.getElementById("searchInput").value.toLowerCase();
            var jobMapping = {
                'company employee': 'company-employee.php',
                'painter': 'painter.php',
                'teacher': 'teacher.php'
                // Add more job titles and their corresponding page URLs here
            };

            if (jobMapping[searchInput]) {
                goToPage(jobMapping[searchInput]);
            } else {
                alert('Job not found. Please try again.');
            }
        }

        // Load user data on page load
        window.onload = function() {
            getUserData();
        };
    </script>

</body>
</html>
