<form action="submit_review.php" method="post">
    <label for="seeker">Select Seeker:</label>
    <select name="s_id" id="seeker">
        <!-- Dynamically populate this with seekers from your database -->
        <option value="1">Seeker 1</option>
        <option value="2">Seeker 2</option>
    </select>

    <label for="rating">Rating (1-5):</label>
    <input type="number" id="rating" name="rating" min="1" max="5" required>

    <label for="review_text">Review:</label>
    <textarea id="review_text" name="review_text" rows="4" cols="50"></textarea>

    <button type="submit">Submit Review</button>
</form>
