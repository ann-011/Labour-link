<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('desktop-wallpaper-construction-worker-construction-work.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5); /* Add a semi-transparent overlay */
    }

    form {
      background: #fff;
      padding: 60px;  /* Increased padding for a larger form */
      width: 400px;  /* Set a fixed width */
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      position: relative; /* Added relative position for positioning the back button */
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }

    .input-box {
      position: relative;
      margin-bottom: 30px;
    }

    .input-box input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .input-box i {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .remember-forgot label {
      color: #333;
    }

    .remember-forgot a {
      color: #333;
      text-decoration: none;
    }

    .remember-forgot a:hover {
      text-decoration: underline;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #5cb85c;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4cae4c;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
    }

    .register-link a {
      color: #333;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .back-btn {
      background-color: #f44336;  /* Red color for the back button */
      color: white;
      border: none;
      padding: 8px 16px;  /* Smaller padding for a smaller button */
      font-size: 14px;  /* Smaller font size */
      border-radius: 5px;
      cursor: pointer;
      width: auto;  /* Let the button be sized to its content */
      position: absolute; /* Position at the bottom */
      bottom: 20px; /* 20px from the bottom of the form */
      left: 50%; /* Center horizontally */
      transform: translateX(-50%); /* Adjust to center */
    }

    .back-btn:hover {
      background-color: #e53935; /* Darker red on hover */
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <form action="login.php" method="POST">
      <h1>Login</h1>

      <div class="input-box">
        <input type="text" placeholder="Email" id="mail" name="mail" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password" id="pass" name="pass" required>
        <i class="far fa-eye" id="togglePassword"></i>
      </div>

      <label for="selection">Select your post:</label> 
      <select id="selection" name="selection" required> 
        <option value="seeker">Jobseeker</option> 
        <option value="recruiter">Recruiter</option> 
        <option value="admin">Admin</option> 
      </select> <br>

      <button type="submit" id="login" name="login" class="btn">Login</button><br>

      <div class="register-link">
        <p>Don't have an account? <a href="secondpage.html">Register</a></p>
      </div>

      <!-- Back Button -->
      <button type="button" class="back-btn" onclick="window.location.href='1stpage.html'">Back</button>
    </form>
  </div>
</body>
</html>
